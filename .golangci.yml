version: "2"

linters:
  default: none
  enable:
    - contextcheck
    - errcheck
    - errorlint
    - exhaustive
    - godot
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dawsonalex/grr
